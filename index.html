<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummerTube - Downloader</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff0000; font-size: 2.5rem; margin-bottom: 10px; }
        span { color: #fff; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: #ff0000;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { background: #cc0000; }
        p { color: #aaa; font-size: 0.9rem; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Summer<span>Tube</span></h1>
        <p>Cole o link do vídeo abaixo:</p>
        
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button onclick="baixar()">BAIXAR VÍDEO</button>

        <p id="status"></p>
    </div>

    <script>
        function baixar() {
            const url = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');

            if (!url) {
                alert("Por favor, cole um link!");
                return;
            }

            status.innerText = "Processando download... aguarde.";

            // IMPORTANTE: Depois que você criar o app no Render, 
            // vamos trocar o 'localhost:3000' pelo link real do seu servidor.
            // Substitua a linha antiga por esta:
            const serverUrl = "/download?url=" + encodeURIComponent(url);


            
            // Inicia o download
            window.location.href = serverUrl;
        }
    </script>

</body>
          </html>
